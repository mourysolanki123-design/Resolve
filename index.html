<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resolve · IT support lab</title><style>
:root{--ink:#182c36;--muted:#657780;--line:#dbe3e6;--accent:#087f72;--bg:#f4f7f7}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:9px 14px}button:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible{outline:3px solid #80cabd}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.small{padding:5px 10px;font-size:13px}aside{position:fixed;inset:0 auto 0 0;width:224px;background:#122e36;color:#d0e0e4;padding:30px 20px;display:flex;flex-direction:column}.brand{font-size:30px;color:white;font-weight:750;letter-spacing:-1.5px}.brand span{color:#5ed5b8}aside small{color:#94afb7}nav{display:grid;gap:8px;margin-top:42px}nav button{border:0;background:none;color:#b6cbd1;text-align:left;padding:12px 14px}nav button.active{background:#27464d;color:white}.sidefoot{margin-top:auto;font-size:12px;color:#9cb7bf}main{margin-left:224px;padding:35px 5%;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--accent);text-transform:uppercase}h1{font-size:32px;letter-spacing:-1px;margin:5px 0}h2{font-size:19px;margin:0 0 15px}h3{font-size:16px}p{color:var(--muted)}header p{margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:23px}.stat strong{display:block;font-size:34px;font-weight:650;letter-spacing:-1px}.stat span{color:var(--muted);font-size:13px}.split{display:grid;grid-template-columns:1.7fr 1fr;gap:22px;margin-top:24px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.toolbar input{flex:1;min-width:180px}input,select,textarea{border:1px solid #c7d4d9;border-radius:7px;padding:10px;background:white;color:var(--ink);max-width:100%}textarea{min-height:95px;resize:vertical}label{display:grid;gap:6px;font-size:13px;font-weight:600}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{color:var(--muted);font-weight:500;font-size:12px;border-bottom:1px solid var(--line);padding:12px}td{padding:16px 12px;border-bottom:1px solid #edf1f2;font-size:14px}td small{display:block;color:var(--muted)}.badge{display:inline-block;border-radius:5px;padding:3px 8px;font-size:12px;background:#eef2f4;white-space:nowrap}.high{background:#fff0e5;color:#a34c12}.critical{background:#fde8e9;color:#a52d3e}.resolved{background:#dff3ec;color:#147052}.link{padding:0;border:0;background:none;color:#087c70;text-align:left;font-weight:600}.note{border-left:3px solid #51b59e;padding:12px 16px;background:#eaf5f1;margin-top:20px;font-size:13px;color:#315e53}.empty{text-align:center;padding:45px;color:var(--muted)}.stack{display:grid;gap:16px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center}.bar{height:8px;border-radius:8px;background:#e8efef;margin:7px 0 16px}.bar div{height:100%;background:#159b87;border-radius:8px}.guide{padding:17px 0;border-bottom:1px solid var(--line)}details summary{cursor:pointer;font-weight:650}li{margin:9px 0}dialog{border:0;border-radius:14px;width:min(680px,94vw);max-height:90vh;padding:28px;color:var(--ink);box-shadow:0 25px 90px #102f3650}dialog::backdrop{background:#0c253570}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.muted{color:var(--muted);font-size:13px}.toast{position:fixed;bottom:25px;right:25px;background:#183e38;color:white;padding:13px 20px;border-radius:9px;z-index:9;max-width:90vw}.scenario{display:flex;flex-direction:column}.scenario button{margin-top:auto;align-self:flex-start}.scenario p{flex:1}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:20px}.history{font-size:13px;padding:12px;background:#f3f6f7;border-radius:8px;margin:8px 0;white-space:pre-wrap}.subtle{font-size:12px;color:#7a8c93}.hero{background:#e1f0eb;border:1px solid #c9e2d8;padding:25px;border-radius:12px;margin-bottom:24px}.hero h2{font-size:23px;margin-bottom:8px}footer{margin-top:32px;color:#7c8e95;font-size:12px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}main{padding:25px}aside{width:185px}main{margin-left:185px}}@media(max-width:650px){aside{position:static;width:auto;padding:16px 20px}nav{display:flex;overflow:auto;margin-top:15px;gap:2px}nav button{white-space:nowrap;padding:8px}.sidefoot{display:none}main{margin:0;padding:22px 16px}header{align-items:flex-start}h1{font-size:27px}.twocol,.formgrid{grid-template-columns:1fr}.card{padding:17px}.grid{gap:10px}.full{grid-column:auto}}
</style></head><body><aside><div class="brand">resolve<span>·</span></div><small>IT SUPPORT LAB</small><nav id="nav"></nav><div class="sidefoot">YOUR PERSONAL WORKSPACE<br><br>Fictional people. Real practice.<br>Saved in this browser.</div></aside><main id="main"></main><dialog id="modal"></dialog><div id="toast" role="status" hidden></div><script>
const KEY='resolve-lab-v1', $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses=['Open','In progress','Waiting','Resolved'], priorities=['Low','Medium','High','Critical'];let page='Overview',query='',filter='All';
const guides=[
['Wi-Fi and connectivity','Establish the scope before changing settings.',['Ask whether one device or everyone is affected and when it started.','Check Wi-Fi is enabled, airplane mode is off, and the intended network is selected.','Inspect adapter status and IP configuration. Compare with a working device where authorised.','Separate local connectivity, DNS and internet access. Record each test and its result.','Make one authorised change at a time; confirm access with the user. Escalate wider outages.']],
['Printing problems','A stopped queue is a symptom, not a diagnosis.',['Confirm the selected printer and whether other users can print.','Check power, connection, paper and displayed errors.','Inspect the queue for a stuck job; ask before cancelling anyone’s work.','Check the Print Spooler state. Restart only when authorised and assess impact on other jobs.','Print a test page, then ask the user to retry the original document.']],
['Login and account access','Verify identity before an account action.',['Capture the exact error without asking for the user’s password.','Check whether the issue affects one application or the full sign-in.','Follow the organisation’s identity verification and password reset process.','Check account lockout, expiry and access groups if authorised.','Confirm successful access and document actions without recording secrets.']],
['Slow computer','Collect evidence before suggesting an upgrade.',['Ask when slowness occurs and whether it began after a change.','Inspect CPU, memory, disk activity and free space while the problem occurs.','Check approved updates and startup applications; avoid disabling protection.','Consider temperature and storage health if symptoms support it.','Record before/after observations and confirm improvement with the user.']],
['Shared folder permissions','Grant the minimum access needed.',['Confirm the exact resource and required business access.','Check connectivity and whether the path is correct.','Confirm the user’s identity and approval from the resource owner.','Review group membership plus share and file permissions in an authorised environment.','Test allowed and denied access; record the approval and result.']],
['Backups and recovery','A backup is useful only if restoration works.',['Confirm which file is missing, its location and last known good time.','Check the recovery policy and available backup versions.','Restore to an alternate location first where possible.','Validate content with the user before replacing anything.','Record the version, destination and verification outcome.']]
];
const scenarios=[
{id:'wifi',title:'The laptop that lost Wi-Fi',category:'Network',priority:'High',asset:'AST-001',body:'Alex can no longer see Wi-Fi networks after a driver update. Other devices connect normally. Document your investigation and a proposed safe fix.',checks:['Establish scope and recent change','Inspect adapter and driver status','Describe an authorised recovery approach','Specify how to verify the connection']},
{id:'print',title:'A queue that will not move',category:'Printing',priority:'Medium',asset:'AST-004',body:'Morgan reports that three print jobs are stuck. The printer is powered on and has paper. Work out what to check before restarting anything.',checks:['Confirm printer and affected users','Inspect queue and connection','Explain impact before cancelling or restarting','Verify a test page and original job']},
{id:'access',title:'New starter, missing access',category:'Access',priority:'Medium',asset:'AST-002',body:'Jamie can sign in but cannot open the Finance shared folder. Their manager says access is needed. Record the checks and approvals you would require.',checks:['Verify identity and exact path','Obtain resource-owner approval','Review groups and effective permissions','Test access with least privilege']},
{id:'slow',title:'A slow start to the day',category:'Hardware',priority:'Low',asset:'AST-003',body:'Taylor’s laptop becomes slow when several applications are open. Diagnose using measurements and explain what would justify an upgrade.',checks:['Capture symptom and workload','Inspect CPU memory disk and space','Compare evidence before changing settings','Record measurable verification']}
];
function seed(){const now=Date.now();return {version:1,assets:[{id:'AST-001',name:'ThinkPad T14',type:'Laptop',os:'Windows 11',owner:'Alex Chen',status:'In use'},{id:'AST-002',name:'Latitude 5440',type:'Laptop',os:'Windows 11',owner:'Jamie Patel',status:'In use'},{id:'AST-003',name:'EliteBook 840',type:'Laptop',os:'Windows 11',owner:'Taylor Reed',status:'In use'},{id:'AST-004',name:'Office LaserJet',type:'Printer',os:'Embedded',owner:'Shared office',status:'In use'},{id:'AST-005',name:'Spare workstation',type:'Desktop',os:'Linux Mint',owner:'IT cupboard',status:'Available'}],tickets:[{id:'TKT-1001',title:'Wi-Fi adapter missing after update',requester:'Alex Chen',category:'Network',priority:'High',status:'Open',asset:'AST-001',description:'Wi-Fi networks are not visible. Other office devices connect normally.',resolution:'',created:now-7200000,resolvedAt:null,history:[]},{id:'TKT-1002',title:'New starter needs shared folder access',requester:'Jamie Patel',category:'Access',priority:'Medium',status:'In progress',asset:'AST-002',description:'Confirm approval and intended access before changing permissions.',resolution:'',created:now-3600000,resolvedAt:null,history:[]},{id:'TKT-1003',title:'Printer test page verified',requester:'Morgan Lee',category:'Printing',priority:'Low',status:'Resolved',asset:'AST-004',description:'Seeded demonstration ticket, not completed work by you.',resolution:'Demo: Correct printer selected and test page confirmed. Fictional outcome.',created:now-86400000,resolvedAt:now-82800000,history:[]} ]};}
let db;try{const stored=localStorage.getItem(KEY);db=stored?JSON.parse(stored):seed();validate(db)}catch(e){db=seed();setTimeout(()=>toast('Saved data could not be loaded. Demo workspace opened; export before saving changes.'),100)}
function validate(d){if(!d||d.version!==1||!Array.isArray(d.tickets)||!Array.isArray(d.assets)||d.tickets.length>5000||d.assets.length>5000)throw Error('Unsupported backup');const ids=new Set();for(const a of d.assets){for(const k of ['id','name','type','os','owner','status'])if(typeof a[k]!=='string')throw Error('Invalid asset');if(ids.has(a.id))throw Error('Duplicate asset ID');ids.add(a.id)}const ti=new Set();for(const t of d.tickets){for(const k of ['id','title','requester','category','priority','status','asset','description','resolution'])if(typeof t[k]!=='string')throw Error('Invalid ticket');if(ti.has(t.id)||!statuses.includes(t.status)||!priorities.includes(t.priority)||!Number.isFinite(t.created)||!Array.isArray(t.history))throw Error('Invalid ticket');if(t.resolvedAt!==null&&!Number.isFinite(t.resolvedAt))throw Error('Invalid date');if(t.status==='Resolved'&&!t.resolution.trim())throw Error('Resolution missing');for(const h of t.history)if(!h||typeof h.text!=='string'||!Number.isFinite(h.at))throw Error('Invalid history');ti.add(t.id)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Browser storage unavailable or full. Export a backup now; changes are only in memory.');return false}}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').hidden=true,5000)}
function badge(s){return `<span class="badge ${esc(s.toLowerCase().replaceAll(' ','-'))}">${esc(s)}</span>`}function date(n){return new Date(n).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}function options(arr,current){return arr.map(s=>`<option ${s===current?'selected':''}>${esc(s)}</option>`).join('')}
function navigate(p){page=p;query='';filter='All';render()}
function render(){ $('#nav').innerHTML=['Overview','Tickets','Assets','Knowledge base','Practice lab','Project guide'].map(p=>`<button class="${page===p?'active':''}" data-page="${p}">${p}</button>`).join('');const desc={Overview:'A clear view of your support workspace.',Tickets:'Track the issue. Record the thinking. Verify the fix.',Assets:'Know the equipment behind every support request.','Knowledge base':'Practical checklists for a thoughtful investigation.','Practice lab':'Build confidence through realistic support scenarios.','Project guide':'Understand the app, practise the workflow, show your evidence.'};$('#main').innerHTML=`<header><div><div class="eyebrow">Personal workspace / ${esc(page)}</div><h1>${esc(page)}</h1><p>${desc[page]}</p></div><button class="primary" data-action="new-ticket">＋ New ticket</button></header><div id="view"></div><footer>Resolve · Personal IT support simulator · All starter records are fictional · Browser-local storage</footer>`;({'Overview':overview,'Tickets':tickets,'Assets':assets,'Knowledge base':knowledge,'Practice lab':practice,'Project guide':project}[page])()}
function ticketTable(list){if(!list.length)return '<div class="empty">No tickets match. Create a ticket or adjust your filters.</div>';return `<div class="tablewrap"><table><thead><tr><th>Ticket / requester</th><th>Priority</th><th>Status</th><th>Opened</th></tr></thead><tbody>${list.map(t=>`<tr><td><button class="link" data-ticket="${esc(t.id)}">${esc(t.title)}</button><small>${esc(t.id)} · ${esc(t.requester)}</small></td><td>${badge(t.priority)}</td><td>${badge(t.status)}</td><td class="muted">${date(t.created)}</td></tr>`).join('')}</tbody></table></div>`}
function overview(){const open=db.tickets.filter(t=>t.status!=='Resolved'),closed=db.tickets.filter(t=>t.status==='Resolved'),dur=closed.filter(t=>t.resolvedAt>=t.created),avg=dur.length?(dur.reduce((s,t)=>s+t.resolvedAt-t.created,0)/dur.length/3600000).toFixed(1)+'h':'—';$('#view').innerHTML=`<div class="grid">${[[open.length,'Active tickets'],[open.filter(t=>['High','Critical'].includes(t.priority)).length,'High / critical'],[db.assets.length,'Tracked assets'],[avg,'Average resolution · includes demos']].map(([n,l])=>`<div class="card stat"><span>${l}</span><strong>${n}</strong></div>`).join('')}</div><div class="split"><section class="card"><div class="row"><h2>Recent tickets</h2><button class="small" data-page="Tickets">View all →</button></div>${ticketTable([...db.tickets].sort((a,b)=>b.created-a.created).slice(0,5))}</section><div class="stack"><section class="card"><h2>Queue breakdown</h2>${statuses.map(s=>{const n=db.tickets.filter(t=>t.status===s).length;return `<div class="row"><span>${s}</span><strong>${n}</strong></div><div class="bar"><div style="width:${db.tickets.length?n/db.tickets.length*100:0}%"></div></div>`}).join('')}</section><section class="card"><div class="eyebrow">Learn by doing</div><h3>Your next support challenge</h3><p>Investigate a missing Wi-Fi adapter and document your reasoning.</p><button data-page="Practice lab">Open practice lab →</button></section></div></div><div class="note">Your changes stay in this browser. Use Export backup in Project guide to keep a portable copy.</div>`}
function tickets(){ $('#view').innerHTML=`<div class="toolbar"><input id="search" aria-label="Search tickets" placeholder="Search title, ID or requester…" value="${esc(query)}"><select id="filter" aria-label="Filter status">${options(['All',...statuses],filter)}</select></div><section class="card" id="ticket-list"></section>`;ticketResults()}
function ticketResults(){const list=db.tickets.filter(t=>(filter==='All'||t.status===filter)&&`${t.id} ${t.title} ${t.requester}`.toLowerCase().includes(query.toLowerCase()));$('#ticket-list').innerHTML=ticketTable([...list].sort((a,b)=>b.created-a.created))}
function assets(){ $('#view').innerHTML=`<div class="toolbar"><input id="asset-search" aria-label="Search assets" placeholder="Search equipment, owner or ID…"><button data-action="new-asset">＋ Add asset</button></div><section class="card" id="asset-list"></section>`;assetResults('')}
function assetResults(q){const list=db.assets.filter(a=>Object.values(a).join(' ').toLowerCase().includes(q.toLowerCase()));$('#asset-list').innerHTML=list.length?`<div class="tablewrap"><table><thead><tr><th>Equipment</th><th>Type / OS</th><th>Assigned to</th><th>Status</th><th></th></tr></thead><tbody>${list.map(a=>`<tr><td><strong>${esc(a.name)}</strong><small>${esc(a.id)}</small></td><td>${esc(a.type)}<small>${esc(a.os)}</small></td><td>${esc(a.owner)}</td><td>${badge(a.status)}</td><td><button class="small" data-asset="${esc(a.id)}">Edit</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No matching equipment.</div>'}
function knowledge(){ $('#view').innerHTML=`<section class="card">${guides.map(([title,summary,steps])=>`<details class="guide"><summary>${title}</summary><p>${summary}</p><ol>${steps.map(x=>`<li>${x}</li>`).join('')}</ol></details>`).join('')}</section><div class="note">These are investigation guides. Follow the organisation’s policies and obtain authorisation before changing real systems.</div>`}
function practice(){ $('#view').innerHTML=`<div class="hero"><div class="eyebrow">Your training ground</div><h2>Turn an issue into a clear explanation.</h2><p>Create a scenario ticket, record your investigation, and write a resolution with a verification step. This app simulates the workflow; it does not perform repairs.</p></div><div class="twocol">${scenarios.map(s=>`<section class="card scenario"><div class="row">${badge(s.category)}${badge(s.priority)}</div><h3>${s.title}</h3><p>${s.body}</p><details><summary>What to cover</summary><ul>${s.checks.map(c=>`<li>${c}</li>`).join('')}</ul></details><br><button class="primary" data-scenario="${s.id}">Create practice ticket →</button></section>`).join('')}</div>`}
function project(){ $('#view').innerHTML=`<div class="twocol"><section class="card"><h2>How to use Resolve</h2><ol><li>Create a ticket with a clear symptom, requester and affected device.</li><li>Choose a priority based on impact and urgency.</li><li>Move it to In progress and add investigation notes.</li><li>Use the knowledge base to plan appropriate checks.</li><li>Write the cause, proposed action and verification in the resolution. For simulated work, label it as proposed.</li><li>Resolve it and review your dashboard.</li></ol><h3>What this project demonstrates</h3><p>Ticket triage, asset records, structured troubleshooting, communication and record keeping. It does not certify technical skills or simulate a real Windows domain.</p><h3>Honest portfolio description</h3><p>Developed an AI-assisted browser-based IT support simulator and practised ticket triage, asset tracking and resolution documentation using fictional scenarios.</p><p>Use that description after completing the exercises and learning how the app works.</p></section><section class="card"><h2>Your data</h2><p>Records are saved in this browser’s local storage. They do not sync across devices. Clearing browser data removes them. Export regularly.</p><div class="toolbar"><button data-action="export" class="primary">Export backup</button><button data-action="import">Restore backup</button><button data-action="csv">Export tickets CSV</button></div><input id="import-file" type="file" accept="application/json,.json" hidden><p class="muted">Restore replaces this browser’s records after confirmation. Use fictional information in your portfolio.</p><hr><h3>Start a fresh practice session</h3><p>Reset restores the fictional starter records. Export first to keep your work.</p><button data-action="reset">Reset demo workspace</button><h3>How it is built</h3><p>Plain HTML, CSS and JavaScript. Ticket and asset objects are stored as JSON. Forms validate fields, HTML is escaped, and each ticket retains activity notes. Reports calculate from your current records.</p><h3>Interview practice</h3><p>Why did you choose that priority? What evidence supports the cause? How would you verify a repair? What should never go in a ticket?</p></section></div>`}
function show(html){$('#modal').innerHTML=html;$('#modal').showModal()}function close(){ $('#modal').close() }
function ticketForm(id){const t=db.tickets.find(t=>t.id===id);show(`<form id="ticket-form"><div class="row"><h2>${t?esc(t.id):'New support ticket'}</h2><button type="button" data-action="close" aria-label="Close dialog">✕</button></div><div class="formgrid"><label class="full">Title<input name="title" required maxlength="140" value="${esc(t?.title)}"></label><label>Requester<input name="requester" required maxlength="80" value="${esc(t?.requester)}"></label><label>Category<select name="category">${options(['Network','Hardware','Software','Access','Printing','Other'],t?.category)}</select></label><label>Priority<select name="priority">${options(priorities,t?.priority||'Medium')}</select></label><label>Status<select name="status">${options(statuses,t?.status||'Open')}</select></label><label class="full">Affected asset<select name="asset"><option value="">No linked asset</option>${db.assets.map(a=>`<option value="${esc(a.id)}" ${t?.asset===a.id?'selected':''}>${esc(a.id+' · '+a.name)}</option>`).join('')}</select></label><label class="full">Issue description<textarea name="description" required maxlength="6000">${esc(t?.description)}</textarea></label><label class="full">Investigation note<textarea name="note" maxlength="6000" placeholder="What did you check? What did you find?"></textarea></label><label class="full">Resolution and verification<textarea name="resolution" maxlength="6000" placeholder="Required to resolve. Label simulated actions as proposed.">${esc(t?.resolution)}</textarea></label></div>${t?`<h3>Activity</h3>${t.history.length?t.history.map(h=>`<div class="history"><span class="muted">${date(h.at)}</span><br>${esc(h.text)}</div>`).join(''):'<p class="muted">No activity notes yet.</p>'}`:''}<div class="actions"><button type="button" data-action="close">Cancel</button><button class="primary">Save ticket</button></div><p id="form-error" role="alert" style="color:#a52d3e"></p></form>`);$('#ticket-form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!f.title.trim()||!f.requester.trim()||!f.description.trim()){ $('#form-error').textContent='Title, requester and description cannot be blank.';return}if(f.status==='Resolved'&&!f.resolution.trim()){ $('#form-error').textContent='Add a resolution and verification before resolving this ticket.';return}const now=Date.now(),updated={...(t||{id:'TKT-'+(Math.max(1000,...db.tickets.map(x=>Number(x.id.split('-')[1])||1000))+1),created:now,history:[]}),title:f.title.trim(),requester:f.requester.trim(),category:f.category,priority:f.priority,status:f.status,asset:f.asset,description:f.description.trim(),resolution:f.resolution.trim(),resolvedAt:f.status==='Resolved'?(t?.resolvedAt||now):null};updated.history=[...(t?.history||[])];updated.history.push({at:now,text:t?`Updated ticket · ${f.status} · ${f.priority}`:'Ticket created'});if(f.note.trim())updated.history.push({at:now,text:f.note.trim()});if(t)db.tickets[db.tickets.indexOf(t)]=updated;else db.tickets.unshift(updated);const ok=save();close();render();if(ok)toast('Ticket saved')};}
function assetForm(id){const a=db.assets.find(a=>a.id===id);show(`<form id="asset-form"><div class="row"><h2>${a?'Edit asset':'Add equipment'}</h2><button type="button" data-action="close" aria-label="Close dialog">✕</button></div><div class="formgrid"><label class="full">Device name<input name="name" required maxlength="120" value="${esc(a?.name)}"></label><label>Type<select name="type">${options(['Laptop','Desktop','Printer','Network device','Other'],a?.type)}</select></label><label>Operating system<input name="os" required maxlength="80" value="${esc(a?.os)}"></label><label>Assigned to<input name="owner" required maxlength="80" value="${esc(a?.owner)}"></label><label>Status<select name="status">${options(['In use','Available','Under repair','Retired'],a?.status)}</select></label></div><div class="actions"><button type="button" data-action="close">Cancel</button><button class="primary">Save asset</button></div><p id="form-error" role="alert"></p></form>`);$('#asset-form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(['name','os','owner'].some(k=>!f[k].trim())){$('#form-error').textContent='Please complete each field.';return}const row={...f,id:a?.id||'AST-'+(Math.max(0,...db.assets.map(x=>Number(x.id.split('-')[1])||0))+1).toString().padStart(3,'0')};if(a)db.assets[db.assets.indexOf(a)]=row;else db.assets.push(row);const ok=save();close();render();if(ok)toast('Asset saved')};}
function download(text,name,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csvCell(s){s=String(s??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)return navigate(b.dataset.page);if(b.dataset.ticket)return ticketForm(b.dataset.ticket);if(b.dataset.asset)return assetForm(b.dataset.asset);if(b.dataset.scenario){const s=scenarios.find(s=>s.id===b.dataset.scenario);ticketForm();const f=$('#ticket-form');f.elements.title.value='Practice: '+s.title;f.elements.requester.value='Practice learner';f.elements.description.value=s.body+'\n\nSIMULATION: Record proposed actions; no real repair is performed by this app.';f.elements.category.value=s.category;f.elements.priority.value=s.priority;f.elements.asset.value=s.asset;return}switch(b.dataset.action){case 'new-ticket':ticketForm();break;case 'new-asset':assetForm();break;case 'close':close();break;case 'export':download(JSON.stringify(db,null,2),'resolve-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json');break;case 'csv':{const cols=['id','title','requester','category','priority','status','asset','description','resolution'];download([cols.join(','),...db.tickets.map(t=>cols.map(c=>csvCell(t[c])).join(','))].join('\r\n'),'resolve-tickets.csv','text/csv;charset=utf-8');break}case 'reset':if(confirm('Replace all your records with demo data? Export first if you want to keep your work.')){db=seed();const ok=save();render();if(ok)toast('Demo workspace restored')}break;case 'import':$('#import-file').click();break}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;ticketResults()}if(e.target.id==='asset-search')assetResults(e.target.value)});
document.addEventListener('change',async e=>{if(e.target.id==='filter'){filter=e.target.value;ticketResults()}if(e.target.id==='import-file'){const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error('Backup must be under 5 MB');const next=JSON.parse(await file.text());validate(next);if(confirm('Replace current records with this backup?')){db=next;const ok=save();render();if(ok)toast('Backup restored')}}catch(err){toast('Could not restore: '+err.message)}e.target.value=''}});
render();
</script></body></html>
